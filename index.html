<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - Spotify</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="shortcut icon" href="imgi_143_default.png" type="image/x-icon">
</head>
<body>
<div class="auth-page">
  <div class="auth-page-logo">
    <img src="imgi_143_default.png" alt="">
  </div>

  <div class="auth-page-title">Sign up to<br>start listening</div>
  <div class="auth-page-form">
    <form action="signup-password.html" method="get">
      <label class="field-label" for="signup-email">Email address</label>
      <input class="field-input" type="email" id="signup-email" name="email" placeholder="name@domain.com" required>
      <button type="submit" class="btn-green-pill">Next</button>
    </form>
    <div class="divider-or">or</div>
    <a href="home.html" class="btn-outline-pill"> <i class="bi bi-phone"></i>Sign up with phone number</a>
    <a href="home.html" class="btn-outline-pill"><i class="bi bi-google"></i>Sign up with Google</a>
    <a href="home.html" class="btn-outline-pill"><i class="bi bi-apple"></i>Sign up with Apple</a>
  </div>
  <div class="auth-page-alt">
    <p>Already have an account?</p>
    <a href="login.html">Log in</a>
  </div>
  <div class="auth-page-disclaimer">
    This site is protected by reCAPTCHA and the Google
    <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a> apply.
  </div>
</div>
</body>
</html>
