<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a password - Spotify</title>
<link rel="stylesheet" href="css/style.css">
<link rel="shortcut icon" href="imgi_143_default.png" type="image/x-icon">
</head>
<body>
<div class="auth-page">
  <div class="auth-page-logo">
    <img src="imgi_143_default.png" alt="">
  </div>
  <a href="signup.html" class="step-back"></a>
  <div class="auth-page-title">Create a password</div>
  <div class="auth-page-form">
    <form action="signup-name.html" method="get">
      <label class="field-label" for="signup-password">Password</label>
      <input class="field-input" type="password" id="signup-password" name="password" placeholder="Create a password" required minlength="8">
      <button type="submit" class="btn-green-pill">Next</button>
    </form>
  </div>
</div>
</body>
</html>
